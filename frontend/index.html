<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>云端浏览器 · Browser Studio</title><link rel="stylesheet" href="/src/style.css"></head>
<body>
<header class="app-header"><a class="brand" href="/"><span class="brand-icon">◈</span><span>Browser Studio<small>云端浏览器工作台</small></span></a><div class="header-actions"><span class="connection"><i></i><span id="status">未连接</span></span><button id="new-session" class="primary">＋ 新建会话</button></div></header>
<main class="workspace"><section class="workspace-heading"><div><div class="eyebrow">YOUR CLOUD WORKSPACE</div><h1>浏览，无需边界<span>。</span></h1><p>打开熟悉的网站，让操作在云端继续。</p></div><div class="session-card"><span>当前会话</span><strong id="session-label">尚未创建</strong></div></section>
<section class="account-pool" id="account-pool"><label for="account-select">登录账号</label><select id="account-select"><option value="default">默认账号（历史登录态）</option></select><button id="switch-account">切换账号</button><button id="add-account">＋ 添加账号</button><span id="account-status" role="status">选择账号后创建会话，首次使用需扫码登录</span></section><section class="browser-shell"><div id="toolbar"><div class="navigation"><button id="back-btn" title="后退" aria-label="后退">←</button><button id="forward-btn" title="前进" aria-label="前进">→</button></div><form id="address-form"><span>⌕</span><input id="address-input" aria-label="网址" placeholder="输入网址，或选择右侧站点登录" autocomplete="off"><button title="前往" aria-label="前往">↵</button></form><select id="auto-select" aria-label="选择站点登录"><option value="">站点快捷登录</option><option value="douyin">抖音扫码登录</option><option value="taobao">淘宝扫码登录</option><option value="jd">京东扫码登录</option><option value="baidu">百度登录</option></select></div>
<div class="utility-bar"><div><span class="live-dot"></span><span id="view-label">远程浏览器</span><span class="divider"></span><span id="stream-stats">等待画面</span><span id="automation-state" aria-live="polite"></span><span id="input-feedback" aria-live="polite"></span></div><div class="utility-actions"><select id="viewport-select" aria-label="浏览器分辨率"><option value="1280x720">1280 × 720</option><option value="1366x768">1366 × 768</option><option value="1440x900">1440 × 900</option><option value="1920x1080">1920 × 1080</option></select><button id="monitor-ai-task" hidden>AI 任务</button><button id="expand-view" aria-pressed="false">放大画面</button><button id="kb-btn">键盘</button><button id="share-btn" style="display:none">分享监控</button><button id="action-history-btn">操作记录</button><button id="export-btn">导出记录</button><button id="reset" class="danger">重置</button></div></div>
<div id="stage"><canvas id="remote-canvas" width="1280" height="720" tabindex="0" aria-label="远程浏览器画面"></canvas><div id="empty-state"><div class="empty-icon">◈</div><h2>你的下一站，从这里开始</h2><p>创建一个会话，连接你的云端浏览器。</p><button id="empty-create" class="primary">创建浏览器会话 →</button><div class="site-chips"><span>抖音</span><span>淘宝</span><span>京东</span><span>百度</span></div></div></div>
<footer class="browser-footer"><span id="task-status" role="status" aria-live="polite">选择站点后，可用手机 App 扫码登录</span><span>独立浏览器会话 · 实时远程操作</span></footer></section><div class="workspace-note"><span>● 即连即用</span><span>登录状态自动保存，失效后重新扫码</span></div></main>
<aside id="monitor-panel" style="display:none"><h3>会话监控</h3><button id="monitor-export-btn">导出监控记录</button><div id="monitor-log"></div></aside><input id="kb-hook" type="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"><script type="module" src="/src/entry.js"></script></body></html>
